name: import-manuscript-reviewer
on:
  push:
    branches:
      - publish-manuscript-reviewer-v1.1.0
    paths:
      - ".autosci-import/**"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct manuscript-reviewer
        shell: bash
        run: |
          set -euo pipefail
          cat .autosci-import/manuscript-reviewer.part* | base64 -d > /tmp/manuscript-reviewer.zip
          rm -rf /tmp/mr && mkdir -p /tmp/mr
          unzip -q /tmp/manuscript-reviewer.zip -d /tmp/mr
          rm -rf skills/manuscript-reviewer
          cp -R /tmp/mr/manuscript-reviewer skills/manuscript-reviewer
          rm -rf .autosci-import
      - name: Commit imported skill
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: add manuscript-reviewer v1.1.0"
          git push
