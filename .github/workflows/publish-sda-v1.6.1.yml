name: Publish scientific-data-analysis v1.6.1

on:
  push:
    branches:
      - publish-sda-v1.6.1-clean
    paths:
      - ".autosci-publish/scientific-data-analysis-v1.6.1.zip"
      - ".github/workflows/publish-sda-v1.6.1.yml"

permissions:
  contents: write

jobs:
  expand-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify release archive
        shell: bash
        run: |
          echo "51cff952d55bf878fd7e1f66f9c4459900c891801019f008e9ecb1cf7f34e1f5  .autosci-publish/scientific-data-analysis-v1.6.1.zip" | sha256sum -c -

      - name: Expand skill
        shell: bash
        run: |
          rm -rf skills/scientific-data-analysis
          rm -rf /tmp/autosci-sda
          mkdir -p /tmp/autosci-sda
          unzip -q .autosci-publish/scientific-data-analysis-v1.6.1.zip -d /tmp/autosci-sda
          test -f /tmp/autosci-sda/scientific-data-analysis/SKILL.md
          test "$(cat /tmp/autosci-sda/scientific-data-analysis/VERSION)" = "1.6.1"
          mv /tmp/autosci-sda/scientific-data-analysis skills/scientific-data-analysis
          rm -rf .autosci-publish
          rm -f .github/workflows/publish-sda-v1.6.1.yml

      - name: Commit expanded skill
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish scientific-data-analysis v1.6.1"
          git push origin HEAD:${GITHUB_REF_NAME}
