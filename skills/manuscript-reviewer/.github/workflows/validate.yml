name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate release package
        run: python scripts/validate_release.py
      - name: Build release archive
        run: python scripts/build_release.py --output "${RUNNER_TEMP}/manuscript-reviewer.zip"
      - name: Verify archive
        run: python -m zipfile -t "${RUNNER_TEMP}/manuscript-reviewer.zip"
