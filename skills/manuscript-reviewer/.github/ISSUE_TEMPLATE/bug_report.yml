name: Bug report
description: Report incorrect review behavior, packaging, or validation failure.
title: "[bug] "
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Describe the reviewer output or package failure.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Minimal reproducible evidence
      description: Provide the smallest non-confidential example that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "1.1.0"
    validations:
      required: true
